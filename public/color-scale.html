<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Color Scale Preview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #EAE9E3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    font-family: 'DM Sans', system-ui, sans-serif;
    padding: 24px 12px;
  }
  h1 {
    font-size: 13px;
    font-weight: 500;
    color: #555;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .subtitle {
    font-size: 11px;
    color: #888;
    margin-bottom: 20px;
  }
  .row {
    display: flex;
    gap: 6px;
    justify-content: center;
    width: 100%;
  }
  .swatch {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
    max-width: 120px;
  }
  .box {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 6px 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .id {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
  }
  .hex {
    font-size: 9px;
    font-weight: 600;
    color: #555;
    font-family: 'DM Sans', monospace;
    user-select: all;
    cursor: text;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>
  <h1>Color Scale</h1>
  <div class="subtitle">#766D08 → #5A67FB · 9 steps · on #EAE9E3</div>
  <div class="row" id="swatches"></div>
  <script>
    const colors = [
      '#3D3F00',  // 1 — deep saturated olive (punchy, complements #9)
      '#4F4C08',  // 2 — dark olive
      '#625C14',  // 3 — rich olive
      '#6C6B63',  // 4 — warm neutral
      '#686A82',  // 5 — grey-lavender
      '#6569A0',  // 6 — muted blue
      '#6169BE',  // 7 — medium blue
      '#5E68DD',  // 8 — blue-purple
      '#5A67FB',  // 9 — vivid blue
    ];
    const container = document.getElementById('swatches');

    for (let i = 0; i < colors.length; i++) {
      const hex = colors[i].toUpperCase();

      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.innerHTML = `
        <div class="box" style="background:${hex}">
          <span class="id">${i + 1}</span>
        </div>
        <span class="hex">${hex}</span>
      `;
      container.appendChild(swatch);
    }
  </script>
</body>
</html>
